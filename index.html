    <style>
      /* Boot screen. Inlined so it paints on the first frame: #root is empty
         until the app bundle parses, which on a slow connection is seconds of
         blank page. Removed once React mounts (see main.tsx). Mirrors the
         route loader in src/index.css so first load and navigation match. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f14;
        transition: opacity 0.35s ease;
      }
      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .ripple {
        --size: 190px;
        height: var(--size);
        aspect-ratio: 1;
        position: relative;
      }
      #boot .box {
        position: absolute;
        border-radius: 50%;
        background: linear-gradient(
          0deg,
          rgba(45, 212, 167, 0.05) 0%,
          rgba(45, 212, 167, 0.12) 100%
        );
        border-top: 1px solid rgba(45, 212, 167, 0.9);
        box-shadow: rgba(0, 0, 0, 0.45) 0 10px 10px 0;
        backdrop-filter: blur(5px);
        animation: boot-ripple 2s infinite ease-in-out;
      }
      #boot .box:nth-child(1) { inset: 40%; z-index: 99; }
      #boot .box:nth-child(2) { inset: 30%; z-index: 98; border-top-color: rgba(45,212,167,0.7); animation-delay: 0.2s; }
      #boot .box:nth-child(3) { inset: 20%; z-index: 97; border-top-color: rgba(45,212,167,0.5); animation-delay: 0.4s; }
      #boot .box:nth-child(4) { inset: 10%; z-index: 96; border-top-color: rgba(45,212,167,0.32); animation-delay: 0.6s; }
      #boot .box:nth-child(5) { inset: 0%;  z-index: 95; border-top-color: rgba(45,212,167,0.18); animation-delay: 0.8s; }
      #boot .mark {
        position: absolute;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        padding: 30%;
      }
      @keyframes boot-ripple {
        0%, 100% { transform: scale(1); box-shadow: rgba(0,0,0,0.45) 0 10px 10px 0; }
        50% { transform: scale(1.3); box-shadow: rgba(0,0,0,0.45) 0 30px 20px 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .box { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="ripple" aria-hidden="true">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="mark">
          <svg width="88" viewBox="0 0 160 76" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g stroke="#2dd4a7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M34 10 L12 38 L34 66" />
              <path d="M130 10 L152 38 L130 66" />
              <path d="M98 68 L114 8" />
            </g>
            <path d="M44 10 L58 10 L68 44 L78 10 L92 10 L75 66 L61 66 Z" fill="#e8edf4" />
          </svg>
        </div>
      </div>
      <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading portfolio</span>
    </div>
    <script>window.__bootAt = Date.now();</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
